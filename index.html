<!doctype html><html lang="es-AR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="192x192" href="calculadora-trebol.png"><link rel="apple-touch-icon" href="calculadora-trebol.png"><title>Munster · Divisor de Cuentas</title><style>
:root {
  --ink: #173b31;
  --muted: #6d7d76;
  --green: #0d7a5d;
  --deep: #075743;
  --mint: #e6f3ee;
  --gold: #d2a14a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.screen {
  min-height: 100svh;
  padding: 24px 14px;
  background:
    radial-gradient(circle at 15% 0%, rgba(210,161,74,.2), transparent 25rem),
    linear-gradient(145deg, #faf7f0, #ece5d8);
}

.app {
  width: min(100%, 520px);
  margin: auto;
  padding: 23px;
  border: 1px solid rgba(23,59,49,.08);
  border-radius: 28px;
  background: rgba(255,255,255,.94);
  box-shadow: 0 24px 65px rgba(45,55,48,.14);
}

header { display: flex; align-items: center; gap: 16px; padding-bottom: 23px; }
header p { margin: 0; color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .25em; }
header h1 { margin: 2px 0 3px; font: 700 clamp(26px,7vw,34px)/1.05 Georgia,serif; letter-spacing: -.03em; }
header div > span { color: var(--muted); font-size: 13px; }

.logo {
  position: relative;
  width: 70px;
  height: 70px;
  flex: 0 0 70px;
  border-radius: 21px;
  background: linear-gradient(145deg,var(--green),var(--deep));
  box-shadow: 0 9px 20px rgba(13,122,93,.24);
}
.leaf { position: absolute; width: 17px; height: 17px; background: #faf6ec; }
.l1 { top: 16px; left: 19px; border-radius: 13px 3px 13px 3px; }
.l2 { top: 16px; right: 19px; border-radius: 3px 13px 3px 13px; }
.l3 { top: 34px; left: 19px; border-radius: 3px 13px 3px 13px; }
.l4 { top: 34px; right: 19px; border-radius: 13px 3px 13px 3px; }
.stem { position:absolute; top:45px; left:33px; width:4px; height:13px; border-radius:4px; background:#faf6ec; transform:rotate(12deg); }
.logo > strong { position:absolute; right:-7px; bottom:-6px; display:grid; width:29px; height:29px; place-items:center; border:3px solid white; border-radius:50%; background:var(--gold); color:white; }

nav { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:5px; border-radius:15px; background:#eff2ef; }
nav button { min-height:45px; border:0; border-radius:11px; background:transparent; color:var(--muted); font-size:13px; font-weight:800; cursor:pointer; }
nav button.active { background:white; color:var(--deep); box-shadow:0 3px 12px rgba(23,59,49,.09); }

.panel { display:grid; gap:21px; padding-top:24px; }
label { display:grid; gap:8px; }
label > span, .people > span { color:#435a52; font-size:14px; font-weight:800; }

.amount { display:flex; align-items:center; min-height:65px; padding:0 17px; border:1.5px solid #d6ded9; border-radius:16px; background:#fbfcfb; }
.amount:focus-within { border-color:var(--green); box-shadow:0 0 0 4px rgba(13,122,93,.1); }
.amount b { margin-right:10px; color:var(--green); font-size:25px; }
.amount input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:29px; font-weight:800; }
.amount input::placeholder { color:#b3beb8; }

.people { display:grid; gap:12px; }
.stepper { display:grid; grid-template-columns:58px 1fr 58px; min-height:60px; align-items:center; overflow:hidden; border:1.5px solid #d6ded9; border-radius:16px; }
.stepper button { height:100%; border:0; background:var(--mint); color:var(--deep); font-size:29px; cursor:pointer; }
.stepper strong { text-align:center; font-size:27px; }
.quick { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.quick button { aspect-ratio:1; border:1px solid #dae2de; border-radius:11px; background:white; color:#4d625a; font-weight:800; cursor:pointer; }
.quick button.selected { border-color:var(--green); background:var(--green); color:white; }

.primary,.secondary { min-height:57px; border-radius:16px; font-weight:900; cursor:pointer; }
.primary { border:0; background:linear-gradient(135deg,var(--green),var(--deep)); color:white; box-shadow:0 9px 22px rgba(13,122,93,.22); }
.primary:disabled { opacity:.4; box-shadow:none; }
.secondary { border:1.5px solid var(--green); background:white; color:var(--deep); }

.results { display:grid; gap:13px; }
.result-title { display:flex; align-items:end; justify-content:space-between; gap:10px; }
.result-title small { color:var(--muted); font-weight:800; letter-spacing:.12em; }
.result-title h2 { margin:3px 0 0; font:700 26px Georgia,serif; }
.result-title em { padding:7px 10px; border-radius:18px; background:var(--mint); color:var(--deep); font-size:11px; font-style:normal; font-weight:900; }
.shares { display:grid; gap:8px; }
.shares article { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:70px; padding:12px 14px; border:1px solid #e0e6e2; border-radius:14px; background:#fbfcfb; }
.shares article > div { display:grid; gap:3px; }
.shares article span { color:var(--muted); font-size:12px; }
.shares article strong { font-size:21px; }
.shares select { max-width:145px; padding:9px 7px; border:1px solid #d7dfdb; border-radius:10px; background:white; color:#3a534a; font-size:12px; font-weight:800; }
.note { margin:-3px 0 1px; color:var(--deep); font-size:12px; text-align:center; }
.check { display:grid; grid-template-columns:1fr auto 24px; align-items:center; gap:8px; padding:14px; border-radius:14px; background:var(--mint); }
.check span { font-size:13px; font-weight:800; }
.check strong { font-size:17px; }
.check i { display:grid; width:24px; height:24px; place-items:center; border-radius:50%; background:var(--green); color:white; font-style:normal; font-weight:900; }
.link { justify-self:center; padding:8px; border:0; background:transparent; color:var(--deep); font-size:13px; font-weight:900; text-decoration:underline; text-underline-offset:4px; cursor:pointer; }

.change { display:grid; gap:7px; min-height:145px; place-content:center; border-radius:21px; background:linear-gradient(145deg,var(--green),var(--deep)); color:white; text-align:center; box-shadow:0 13px 26px rgba(13,122,93,.22); }
.change span { color:rgba(255,255,255,.8); font-size:13px; font-weight:900; letter-spacing:.12em; }
.change strong { font-size:clamp(35px,11vw,49px); letter-spacing:-.04em; }
.change.shortfall { background:linear-gradient(145deg,#b54b3f,#7f2e27); box-shadow:0 13px 26px rgba(127,46,39,.2); }

.whatsapp {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  min-height:50px;
  margin-top:19px;
  border:1px solid #bed9ce;
  border-radius:14px;
  background:#f2faf7;
  color:var(--deep);
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}
.whatsapp span { display:grid; width:23px; height:23px; place-items:center; border-radius:50%; background:#25d366; color:white; font-size:15px; }

footer { margin:15px auto 0; color:#687870; font-size:11px; text-align:center; }

@media (max-width:440px) {
  .screen { padding:10px 7px 18px; }
  .app { padding:18px 14px; border-radius:23px; }
  header { gap:10px; }
  .logo { transform:scale(.88); margin:-4px; }
  nav button { font-size:12px; }
  .quick { gap:4px; }
  .quick button { border-radius:9px; font-size:13px; }
  .shares article { padding:11px; }
  .shares article strong { font-size:19px; }
}

[hidden]{display:none!important}#choose { width:100%; background:var(--green); color:white; margin-bottom:12px; }
</style><main class="screen"><section class="app"><header><img class="logo" src="calculadora-trebol.png" alt="Calculadora con trébol de Munster"><div><p>MUNSTER</p><h1>Divisor de Cuentas</h1><span>Cobros simples. Caja exacta.</span></div></header><nav aria-label="Herramientas"><button class="active" id="splitTab">Dividir cuenta</button><button id="changeTab">Calcular vuelto</button></nav><div class="panel" id="split"><label><span>Total de la cuenta</span><div class="amount"><b>$</b><input id="total" aria-label="Total de la cuenta" inputmode="numeric"></div></label><div class="people"><span>¿Entre cuántas personas?</span><div class="stepper"><button id="minus" aria-label="Restar una persona">−</button><strong id="count"></strong><button id="plus" aria-label="Sumar una persona">+</button></div><div class="quick"><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>8</button><button>10</button></div></div><button class="primary" id="divide" disabled>Dividir cuenta</button><section class="results" id="results" hidden><div class="result-title"><div><small>RESULTADO</small><h2 id="heading"></h2></div><em>Redondeado a $10</em></div><button class="secondary" id="choose"></button><div class="shares" id="shares"></div><p class="note" id="note">El efectivo se redondea automáticamente a $100.</p><div class="check"><span>Total distribuido</span><strong id="sum"></strong><i>✓</i></div><button class="link" id="reset">Nueva cuenta</button></section></div><div class="panel" id="changePanel" hidden><label><span>Importe a cobrar</span><div class="amount"><b>$</b><input id="charge" aria-label="Importe a cobrar" inputmode="numeric"></div></label><label><span>El cliente entrega</span><div class="amount"><b>$</b><input id="received" aria-label="El cliente entrega" inputmode="numeric"></div></label><div class="change" id="balance"><span></span><strong></strong></div><button class="link" id="clear">Limpiar</button></div><button class="whatsapp" id="share"><span>↗</span> Compartir la aplicación por WhatsApp</button></section><footer>Hecho para el equipo de Munster</footer></main><script>
const paymentNames = {
  none: "Sin definir",
  cash: "Efectivo",
  debit: "Débito",
  credit: "Crédito",
  qr: "QR / Transferencia",
};

const pesos = new Intl.NumberFormat("es-AR", {
  style: "currency",
  currency: "ARS",
  maximumFractionDigits: 0,
});

function numberFrom(value) {
  return Number(value.replace(/\D/g, "")) || 0;
}

function displayInput(value) {
  const number = numberFrom(value);
  return number ? new Intl.NumberFormat("es-AR").format(number) : "";
}

function distribute(total, count, step) {
  if (!total || count < 1) return [];
  const base = Math.floor(total / count / step) * step;
  const parts = Array(count).fill(base);
  let remainder = total - base * count;
  let index = count - 1;

  while (remainder >= step) {
    parts[index] += step;
    remainder -= step;
    index = index === 0 ? count - 1 : index - 1;
  }
  if (remainder) parts[count - 1] += remainder;
  return parts;
}

function distributeWithPayments(total, payments) {
  const cash = payments
    .map((payment, index) => (payment === "cash" ? index : -1))
    .filter((index) => index >= 0);
  if (!cash.length) return distribute(total, payments.length, 10);
  if (cash.length === payments.length)
    return distribute(total, payments.length, 100);

  const result = Array(payments.length).fill(0);
  const cashShare = Math.floor(total / payments.length / 100) * 100;
  cash.forEach((index) => (result[index] = cashShare));

  const others = payments
    .map((payment, index) => (payment !== "cash" ? index : -1))
    .filter((index) => index >= 0);
  const rest = distribute(
    total - cashShare * cash.length,
    others.length,
    10,
  );
  others.forEach((index, position) => (result[index] = rest[position]));
  return result;
}


const el=id=>document.getElementById(id);
let people=3, payments=[], showPayments=false;
function updatePeople(n){
 people=Math.max(2,Math.min(50,n));
 payments=Array.from({length:people},(_,i)=>payments[i]||"none");
 el("count").textContent=people;
 document.querySelectorAll(".quick button").forEach(b=>b.classList.toggle("selected",Number(b.textContent)===people));
 el("results").hidden=true;
 el("divide").hidden=false;
 el("divide").disabled=!numberFrom(el("total").value);
}
function calculate(){
 const total=numberFrom(el("total").value);
 const parts=showPayments?distributeWithPayments(total,payments):distribute(total,people,10);
 el("results").hidden=false;
 el("divide").hidden=true;
 el("heading").textContent=people+" pagos";
 el("shares").replaceChildren();
 parts.forEach((amount,i)=>{
  const row=document.createElement("article");
  row.innerHTML="<div><span>Persona "+(i+1)+"</span><strong>"+pesos.format(amount)+"</strong></div>";
  if(showPayments){
   const menu=document.createElement("select");
   menu.setAttribute("aria-label","Medio de pago persona "+(i+1));
   Object.entries(paymentNames).forEach(([key,name])=>menu.add(new Option(name,key)));
   menu.value=payments[i];menu.onchange=()=>{payments[i]=menu.value;calculate()};
   row.append(menu);
  }
  el("shares").append(row);
 });
 el("choose").textContent=showPayments?"Ocultar medios de pago":"¿Cómo paga cada uno?";
 el("note").hidden=!(showPayments&&payments.includes("cash"));
 el("sum").textContent=pesos.format(parts.reduce((a,b)=>a+b,0));
}
function change(){
 const charge=numberFrom(el("charge").value), received=numberFrom(el("received").value);
 const difference=charge&&received?received-charge:0;
 const box=el("balance");
 box.classList.toggle("shortfall",difference<0);
 box.firstElementChild.textContent=difference<0?"FALTA PAGAR":"DAR DE VUELTO";
 box.lastElementChild.textContent=pesos.format(Math.abs(difference));
}
function switchTab(split){
 el("split").hidden=!split;el("changePanel").hidden=split;
 el("splitTab").classList.toggle("active",split);el("changeTab").classList.toggle("active",!split);
}
el("splitTab").onclick=()=>switchTab(true);
el("changeTab").onclick=()=>switchTab(false);
el("minus").onclick=()=>updatePeople(people-1);
el("plus").onclick=()=>updatePeople(people+1);
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>updatePeople(Number(b.textContent)));
document.querySelectorAll("input").forEach(input=>input.oninput=()=>{
 input.value=displayInput(input.value);
 if(input.id==="total")updatePeople(people);else change();
});
el("divide").onclick=calculate;
el("choose").onclick=()=>{showPayments=!showPayments;calculate()};
el("reset").onclick=()=>{el("total").value="";payments=[];showPayments=false;updatePeople(3)};
el("clear").onclick=()=>{el("charge").value="";el("received").value="";change()};
el("share").onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent("Te comparto el Divisor de Cuentas de Munster: "+location.origin+location.pathname),"_blank","noopener,noreferrer");
updatePeople(3);change();
</script></html>
